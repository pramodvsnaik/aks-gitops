name: SonarScan-Build

on: 
 workflow_dispatch:

jobs:
  SonarScan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
         fetch-depth: 0
         
      - name: Official SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.0.0
        with:
          args: >
               -Dsonar.organiszation=pramodvsnaik
               -Dsonar.projectKey=aks-gitops
            
          
 
   
